name: Weekly Literature Digest

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai requests python-dotenv

      - name: Restore seen-paper cache
        uses: actions/cache@v4
        with:
          path: data/
          key: seen-papers-${{ github.ref_name }}
          restore-keys: |
            seen-papers-

      - name: Run weekly digest
        env:
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          POST_TO_SLACK: "0"
        run: |
          python pubmed_digest.py \
            --topic-file topics/taste_hedgehog.txt \
            --days-back 7 \
            --retmax 20 \
            --candidate-pool-size 50 \
            --mark-seen-without-scoring \
            --sources pubmed,biorxiv

      - name: Commit digest outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add output/
          git commit -m "Update weekly literature digest" || echo "No changes to commit"
          git push