name: Weekly Chemosciences Digest

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chemosciences-digest
  cancel-in-progress: false

jobs:
  chemosciences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Isolate generated data from the PhD branch
        run: |
          if git ls-remote --exit-code --heads origin chemosciences-data; then
            git fetch origin chemosciences-data
            git switch -c chemosciences-data --track origin/chemosciences-data
            git restore --source "origin/${GITHUB_REF_NAME}" -- chemosciences_digest.py config/chemosciences.json tests/test_chemosciences.py
          else
            git switch -c chemosciences-data
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test independent ontology pipeline
        run: python -m unittest discover -s tests -p 'test_chemosciences*.py'
      - name: Retrieve and rank the completed week
        run: python chemosciences_digest.py
      - name: Publish chemosciences data only
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add chemosciences_digest.py config/chemosciences.json tests/test_chemosciences.py output/chemosciences/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update weekly chemosciences digest"
          git push origin HEAD:refs/heads/chemosciences-data
